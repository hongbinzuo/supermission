name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Capability baseline
        run: bun run test:capability

      - name: Test
        run: bun run test

      - name: Build
        run: bun run build

      - name: Package dry run
        run: npm pack --dry-run
